# Default stack: db, then migrate, then vocab, then pipeline.
# Each job waits for the one before it to finish successfully. No sleep loops.

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: labpipe-app
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  volumes:
    - ./out:/app/out
    - ./data/vocab:/app/data/vocab:ro

services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["labpipe", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  vocab:
    <<: *app
    command: ["labpipe", "vocab", "load"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  pipeline:
    <<: *app
    command: ["labpipe", "run", "--all"]
    depends_on:
      vocab:
        condition: service_completed_successfully

volumes:
  pgdata:
