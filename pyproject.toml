[project]
name = "hl7-fhir-omop-pipeline"
version = "0.1.0"
description = "Synthetic HL7 v2 lab results carried through FHIR R4 into OMOP CDM 5.4."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fhir-resources>=8.3.0",
    "hl7apy>=1.3.5",
    "psycopg[binary]>=3.3.8",
]

[project.scripts]
labpipe = "labpipe.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
